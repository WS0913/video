# MediaMTX配置文件
# 用于电厂巡检机器人视频传输系统

# 日志级别: debug, info, warn
logLevel: info

# RTSP服务器配置
rtspAddress: :8554
rtspTransports: [tcp, udp]
rtspEncryption: "no"
# RTP和RTCP端口（避免与FastAPI的8000端口冲突）
rtpAddress: :9000
rtcpAddress: :9001

# WebRTC配置（用于低延迟播放）
webrtcAddress: :8889
webrtcICEServers2: []

# HLS配置（备用）
hlsAddress: :8888
hlsAlwaysRemux: no

# RTMP配置（备用）
rtmpAddress: :1935

# 允许所有路径（动态创建）
# 安全说明：
# 1. 本系统部署在局域网内，通过网络隔离保证安全
# 2. 设备注册和心跳通过后端API进行认证
# 3. 生产环境建议启用MediaMTX的publish/read认证
paths:
  all:
    record: no

